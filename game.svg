<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0120"/>
      <stop offset="1" stop-color="#2a0d52"/>
    </linearGradient>
    <clipPath id="c"><rect width="900" height="230" rx="14"/></clipPath>
    <g id="tile">
      <rect width="32" height="32" fill="#7a1fa8"/>
      <rect width="32" height="4" fill="#ff2bd6"/>
      <rect x="0" y="16" width="32" height="2" fill="#4a0f6e"/>
      <rect x="15" y="4" width="2" height="12" fill="#4a0f6e"/>
      <rect x="6" y="18" width="2" height="14" fill="#4a0f6e"/>
      <rect x="24" y="18" width="2" height="14" fill="#4a0f6e"/>
    </g>
    <g id="hill">
      <rect x="0" y="40" width="160" height="30" fill="#3a1470"/>
      <rect x="20" y="24" width="120" height="16" fill="#3a1470"/>
      <rect x="48" y="10" width="64" height="14" fill="#3a1470"/>
    </g>
  </defs>
  <style>
    .t4{animation-duration:4s;animation-iteration-count:infinite}
    .ground{animation:gr .128s linear infinite}
    @keyframes gr{to{transform:translateX(-32px)}}
    .hills{animation:hl 16s linear infinite}
    @keyframes hl{to{transform:translateX(-450px)}}
    .stars{animation:hl2 40s linear infinite}
    @keyframes hl2{to{transform:translateX(-900px)}}
    .world{animation-name:wd;animation-timing-function:linear}
    @keyframes wd{from{transform:translateX(0)}to{transform:translateX(-1000px)}}
    .hero{animation-name:jump;animation-timing-function:ease-in-out}
    @keyframes jump{0%,62%{transform:translateY(0)}75%{transform:translateY(-82px)}88%,100%{transform:translateY(0)}}
    .legA{animation:la .24s steps(1) infinite}
    .legB{animation:lb .24s steps(1) infinite}
    @keyframes la{50%{opacity:0}}
    @keyframes lb{0%{opacity:0}50%{opacity:1}}
    .block{animation-name:bump;transform-box:fill-box}
    @keyframes bump{0%,73%{transform:translateY(0)}76%{transform:translateY(-8px)}80%,100%{transform:translateY(0)}}
    .coin{animation-name:coin}
    @keyframes coin{0%,74%{opacity:0;transform:translateY(0)}76%{opacity:1}86%{opacity:1;transform:translateY(-44px)}92%,100%{opacity:0;transform:translateY(-52px)}}
    .plus{animation-name:plus;font:700 14px 'Courier New',monospace;fill:#28c840}
    @keyframes plus{0%,76%{opacity:0;transform:translateY(0)}80%{opacity:1}95%{opacity:0;transform:translateY(-26px)}100%{opacity:0}}
    .bugleg{animation:la .2s steps(1) infinite}
    .hud{font:700 15px 'Courier New',monospace;fill:#fff}
    .blink{animation:bl 1s steps(1) infinite}
    @keyframes bl{50%{opacity:0}}
    .tw{animation:tw 2.5s ease-in-out infinite}
    @keyframes tw{50%{opacity:.2}}
  </style>

  <g clip-path="url(#c)">
    <rect width="900" height="230" fill="url(#sky)"/>

    <!-- estrelas -->
    <g class="stars" fill="#fff">
      <rect class="tw" x="40" y="30" width="3" height="3"/><rect x="170" y="60" width="2" height="2"/>
      <rect class="tw" x="300" y="22" width="3" height="3" style="animation-delay:1s"/><rect x="460" y="50" width="2" height="2"/>
      <rect class="tw" x="610" y="28" width="3" height="3" style="animation-delay:.5s"/><rect x="760" y="70" width="2" height="2"/>
      <rect class="tw" x="940" y="30" width="3" height="3"/><rect x="1070" y="60" width="2" height="2"/>
      <rect class="tw" x="1200" y="22" width="3" height="3" style="animation-delay:1s"/><rect x="1360" y="50" width="2" height="2"/>
      <rect class="tw" x="1510" y="28" width="3" height="3" style="animation-delay:.5s"/><rect x="1660" y="70" width="2" height="2"/>
    </g>

    <!-- morros ao fundo -->
    <g class="hills">
      <use href="#hill" x="20" y="128"/><use href="#hill" x="250" y="128"/>
      <use href="#hill" x="470" y="128"/><use href="#hill" x="700" y="128"/>
      <use href="#hill" x="920" y="128"/><use href="#hill" x="1150" y="128"/>
      <use href="#hill" x="1370" y="128"/>
    </g>

    <!-- chão -->
    <g class="ground">
      <use href="#tile" x="0" y="198"/><use href="#tile" x="32" y="198"/><use href="#tile" x="64" y="198"/><use href="#tile" x="96" y="198"/>
      <use href="#tile" x="128" y="198"/><use href="#tile" x="160" y="198"/><use href="#tile" x="192" y="198"/><use href="#tile" x="224" y="198"/>
      <use href="#tile" x="256" y="198"/><use href="#tile" x="288" y="198"/><use href="#tile" x="320" y="198"/><use href="#tile" x="352" y="198"/>
      <use href="#tile" x="384" y="198"/><use href="#tile" x="416" y="198"/><use href="#tile" x="448" y="198"/><use href="#tile" x="480" y="198"/>
      <use href="#tile" x="512" y="198"/><use href="#tile" x="544" y="198"/><use href="#tile" x="576" y="198"/><use href="#tile" x="608" y="198"/>
      <use href="#tile" x="640" y="198"/><use href="#tile" x="672" y="198"/><use href="#tile" x="704" y="198"/><use href="#tile" x="736" y="198"/>
      <use href="#tile" x="768" y="198"/><use href="#tile" x="800" y="198"/><use href="#tile" x="832" y="198"/><use href="#tile" x="864" y="198"/>
      <use href="#tile" x="896" y="198"/>
    </g>

    <!-- mundo que passa: bloco, moeda e o bug -->
    <g class="world t4">
      <g class="block t4">
        <rect x="950" y="44" width="32" height="32" fill="#ffd23f"/>
        <rect x="950" y="44" width="32" height="4" fill="#fff1a8"/>
        <rect x="950" y="72" width="32" height="4" fill="#c98a00"/>
        <text x="966" y="66" text-anchor="middle" style="font:700 13px 'Courier New',monospace;fill:#2a0d52">&lt;/&gt;</text>
      </g>
      <g class="coin t4">
        <rect x="958" y="22" width="16" height="20" fill="#ffd23f"/>
        <rect x="954" y="26" width="24" height="12" fill="#ffd23f"/>
        <rect x="963" y="26" width="6" height="12" fill="#c98a00"/>
      </g>
      <text class="plus t4" x="985" y="40">+1 commit</text>

      <!-- bug inimigo -->
      <g>
        <rect x="952" y="180" width="26" height="14" fill="#ff3b5c"/>
        <rect x="956" y="176" width="18" height="4" fill="#ff3b5c"/>
        <rect x="962" y="180" width="2" height="14" fill="#8a0f2a"/>
        <rect x="946" y="182" width="8" height="8" fill="#8a0f2a"/>
        <rect x="947" y="183" width="2" height="2" fill="#fff"/>
        <rect x="942" y="178" width="2" height="5" fill="#8a0f2a"/>
        <g class="bugleg" fill="#8a0f2a">
          <rect x="956" y="194" width="2" height="4"/><rect x="966" y="194" width="2" height="4"/><rect x="974" y="194" width="2" height="4"/>
        </g>
      </g>
    </g>

    <!-- herói devmania (personagem original) -->
    <g class="hero t4">
      <!-- antena -->
      <rect x="194" y="138" width="2" height="8" fill="#b14cff"/>
      <rect x="192" y="134" width="6" height="5" fill="#00f0ff" class="blink"/>
      <!-- cabeça -->
      <rect x="180" y="146" width="30" height="20" fill="#d9c8ff"/>
      <rect x="184" y="151" width="22" height="9" fill="#140a2b"/>
      <rect x="187" y="153" width="5" height="5" fill="#00f0ff"/>
      <rect x="198" y="153" width="5" height="5" fill="#00f0ff"/>
      <!-- corpo / moletom -->
      <rect x="182" y="166" width="26" height="18" fill="#b14cff"/>
      <rect x="182" y="166" width="26" height="3" fill="#ff2bd6"/>
      <text x="195" y="180" text-anchor="middle" style="font:700 9px 'Courier New',monospace;fill:#fff">{}</text>
      <!-- braços -->
      <rect x="176" y="168" width="6" height="12" fill="#7a1fa8"/>
      <rect x="208" y="168" width="6" height="12" fill="#7a1fa8"/>
      <!-- pernas (alternam = correndo) -->
      <g class="legA" fill="#22114a">
        <rect x="184" y="184" width="8" height="14"/><rect x="200" y="184" width="8" height="10"/>
      </g>
      <g class="legB" fill="#22114a">
        <rect x="184" y="184" width="8" height="10"/><rect x="200" y="184" width="8" height="14"/>
      </g>
    </g>

    <!-- HUD -->
    <text class="hud" x="20" y="28">DEVMANIA</text>
    <text class="hud" x="20" y="46" style="fill:#00f0ff">FASE JS-01</text>
    <text class="hud" x="880" y="28" text-anchor="end" style="fill:#ff2bd6">♥ ♥ ♥</text>
    <text class="hud blink" x="880" y="46" text-anchor="end" style="fill:#ffd23f;font-size:12px">BUGS ESMAGADOS: ∞</text>
  </g>
</svg>
