<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0120"/>
      <stop offset="0.65" stop-color="#1d0b45"/>
      <stop offset="1" stop-color="#3a0d5c"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#b14cff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1000" height="280" rx="18"/></clipPath>
    <clipPath id="floor"><rect x="0" y="200" width="1000" height="80"/></clipPath>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .star{fill:#fff;animation:tw 3s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
    .grid{animation:move 1.2s linear infinite}
    @keyframes move{from{transform:translateY(0)}to{transform:translateY(20px)}}
    .main{font:900 92px 'Trebuchet MS','Segoe UI',Arial,sans-serif;letter-spacing:4px}
    .g1{fill:#00f0ff;opacity:.7;animation:gl1 3.5s infinite}
    .g2{fill:#ff2bd6;opacity:.7;animation:gl2 3.5s infinite}
    @keyframes gl1{0%,88%,100%{transform:translate(0,0)}90%{transform:translate(-6px,2px)}93%{transform:translate(4px,-2px)}96%{transform:translate(-2px,0)}}
    @keyframes gl2{0%,88%,100%{transform:translate(0,0)}90%{transform:translate(6px,-2px)}93%{transform:translate(-4px,2px)}96%{transform:translate(2px,0)}}
    .sub{font:600 20px 'Courier New',monospace;fill:#d9c8ff}
    .cur{fill:#00f0ff;animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .float{font:700 26px 'Courier New',monospace;fill:#b14cff;opacity:.55;animation:fl 5s ease-in-out infinite}
    @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  </style>

  <g clip-path="url(#clip)">
    <rect width="1000" height="280" fill="url(#bg)"/>

    <!-- estrelas -->
    <circle class="star" cx="60" cy="40" r="1.6"/>
    <circle class="star" cx="140" cy="95" r="1.2" style="animation-delay:.6s"/>
    <circle class="star" cx="230" cy="30" r="1.8" style="animation-delay:1.3s"/>
    <circle class="star" cx="330" cy="70" r="1.1" style="animation-delay:2s"/>
    <circle class="star" cx="420" cy="22" r="1.5" style="animation-delay:.3s"/>
    <circle class="star" cx="590" cy="35" r="1.3" style="animation-delay:1.7s"/>
    <circle class="star" cx="680" cy="85" r="1.7" style="animation-delay:.9s"/>
    <circle class="star" cx="770" cy="28" r="1.2" style="animation-delay:2.4s"/>
    <circle class="star" cx="860" cy="60" r="1.6" style="animation-delay:1.1s"/>
    <circle class="star" cx="945" cy="110" r="1.3" style="animation-delay:.4s"/>
    <circle class="star" cx="35" cy="130" r="1.1" style="animation-delay:1.9s"/>
    <circle class="star" cx="510" cy="60" r="1" style="animation-delay:2.7s"/>

    <!-- sol synthwave -->
    <g opacity=".55">
      <circle cx="500" cy="230" r="58" fill="url(#sun)"/>
      <rect x="430" y="186" width="140" height="3" fill="#2a0d52"/>
      <rect x="430" y="192" width="140" height="4" fill="#2a0d52"/>
    </g>

    <!-- chão com grade em movimento -->
    <rect x="0" y="200" width="1000" height="80" fill="#12032e"/>
    <g clip-path="url(#floor)" stroke="#ff2bd6" stroke-opacity=".55" stroke-width="1.4">
      <g class="grid">
        <line x1="0" y1="185" x2="1000" y2="185"/><line x1="0" y1="205" x2="1000" y2="205"/>
        <line x1="0" y1="225" x2="1000" y2="225"/><line x1="0" y1="245" x2="1000" y2="245"/>
        <line x1="0" y1="265" x2="1000" y2="265"/><line x1="0" y1="285" x2="1000" y2="285"/>
      </g>
      <line x1="500" y1="200" x2="500" y2="280"/>
      <line x1="460" y1="200" x2="300" y2="280"/><line x1="540" y1="200" x2="700" y2="280"/>
      <line x1="420" y1="200" x2="100" y2="280"/><line x1="580" y1="200" x2="900" y2="280"/>
      <line x1="380" y1="200" x2="-100" y2="280"/><line x1="620" y1="200" x2="1100" y2="280"/>
    </g>
    <line x1="0" y1="200" x2="1000" y2="200" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>

    <!-- símbolos flutuando -->
    <text class="float" x="80" y="175">&lt;/&gt;</text>
    <text class="float" x="880" y="165" style="animation-delay:1.5s">{ }</text>
    <text class="float" x="190" y="60" style="animation-delay:.8s;font-size:20px">=&gt;</text>
    <text class="float" x="790" y="70" style="animation-delay:2.2s;font-size:20px">npm</text>

    <!-- título com glitch -->
    <g text-anchor="middle">
      <text class="main g1" x="500" y="130">devmania</text>
      <text class="main g2" x="500" y="130">devmania</text>
      <text class="main" x="500" y="130" fill="url(#txt)" filter="url(#glow)">devmania</text>
    </g>

    <text class="sub" x="500" y="172" text-anchor="middle">&gt; Ericles Alves · Full Stack em construção</text>
    <rect class="cur" x="758" y="157" width="11" height="19"/>
  </g>
</svg>
